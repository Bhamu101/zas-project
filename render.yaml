services:
  - type: web
    name: zas-irrigation-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Supabase project whose public JWKS is used to verify the bearer token on
      # every /api/* request (see backend/auth.py). Not a secret — the same URL
      # ships inside the mobile app — so it lives here rather than being set by
      # hand in the dashboard. Without it every authenticated request 500s.
      - key: SUPABASE_URL
        value: https://ewseaaucyujohlepufpo.supabase.co
      # Optional: extra browser origins for CORS, comma-separated. Native app
      # traffic sends no Origin and is unaffected.
      - key: CORS_EXTRA_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_WHATSAPP_TO
        sync: false
      # Bed 1's ESP32 lives on the farm's local WiFi, not the public internet —
      # this deployed backend can't reach a LAN IP directly. Point this at a
      # persistent public tunnel to the ESP32 instead (see CHANGED_FILES.txt /
      # PROJECT_CONTEXT.md for the ngrok reserved-domain setup). Leave unset to
      # keep Bed 1 simulated like the other beds until that tunnel is running.
      - key: ESP32_BASE_URL
        sync: false
